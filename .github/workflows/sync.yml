name: Sync SSL Certs

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qiniucert-automation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Restore cert cache
        uses: actions/cache/restore@v6
        with:
          path: .cert_cache.json
          key: cert-cache-${{ github.run_id }}
          restore-keys: |
            cert-cache-

      - name: Create config from secrets
        run: |
          cat > config.yaml << 'EOF'
          tencent:
            secret_id: "${{ secrets.TENCENT_SECERT_ID }}"
            secret_key: "${{ secrets.TENCENT_SECRET_KEY }}"
            region: "ap-guangzhou"
          qiniu:
            access_key: "${{ secrets.QINIU_ACCESS_KEY }}"
            secret_key: "${{ secrets.QINIU_SECRET_KEY }}"
          sync:
            force_https: true
          EOF

      - name: Run sync
        run: npx tsx src/cli.ts sync

      - name: Check certificate expiry
        run: npx tsx src/cli.ts check-expiry --warn-days 7

      - name: Save cert cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cert_cache.json
          key: cert-cache-${{ github.run_id }}
