name: Keep scheduled workflows alive

on:
  schedule:
    # Real repository activity prevents GitHub disabling schedules after 60 days.
    - cron: "17 4 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qiniucert-automation
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.repository == 'SwimmingLiu/QiNiuCert'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Commit activity timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          date -u +"%Y-%m-%d" > .github/keepalive
          if git diff --quiet; then
            echo "Keepalive timestamp is already current."
            exit 0
          fi
          git add .github/keepalive
          git commit -m "chore: keep scheduled workflows alive"
          git push origin main
